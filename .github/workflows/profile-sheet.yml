name: פרופיל טבלה

# ספירות בלבד, בלי פרטים אישיים. רץ ידנית או כשהסקריפט משתנה.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/profile-sheet.py', 'scripts/summary.ts', 'scripts/parity-real.ts', 'scripts/people-profile.py', '.github/workflows/profile-sheet.yml']

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: לידים לפי אדם מול לפי הגעה
        continue-on-error: true
        run: python3 scripts/people-profile.py 1nTqoRITyNlLJO4Pld0H4SRMIbT21oudBw6mDBoxXaUU 'לידים'
      - name: פרופיל
        run: |
          OUT=$(python3 scripts/profile-sheet.py 1nTqoRITyNlLJO4Pld0H4SRMIbT21oudBw6mDBoxXaUU 'לידים' 2>&1) || { echo "::error::$(echo "$OUT" | tail -3 | tr '\n' ' ')"; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          npx tsx scripts/build-data.ts --sheet 1nTqoRITyNlLJO4Pld0H4SRMIbT21oudBw6mDBoxXaUU --gid 0 --purchases-gid 282711056 --out /tmp/leads.json >/dev/null
          curl -sL -o /tmp/leads.csv "https://docs.google.com/spreadsheets/d/1nTqoRITyNlLJO4Pld0H4SRMIbT21oudBw6mDBoxXaUU/export?format=csv&gid=0"
          curl -sL -o /tmp/purchases.csv "https://docs.google.com/spreadsheets/d/1nTqoRITyNlLJO4Pld0H4SRMIbT21oudBw6mDBoxXaUU/export?format=csv&gid=282711056"
          PARITY=$(npx tsx scripts/parity-real.ts /tmp/leads.csv /tmp/purchases.csv 2>&1 || true)
          OUT="$PARITY"$'\n'"$(npx tsx scripts/summary.ts /tmp/leads.json)"$'\n'"$OUT"
          echo "$OUT"
          # הערה אחת מוגבלת בגודל, אז מפצלים לחלקים של עד 2500 בתים
          python3 - "$OUT" <<'PY'
          import sys
          parts, cur = [], ''
          for line in sys.argv[1].splitlines():
              if len((cur + line).encode()) > 2500 and cur:
                  parts.append(cur); cur = ''
              cur += line + '\n'
          parts.append(cur)
          for i, p in enumerate(parts, 1):
              p = p.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::notice title=פרופיל טבלה {i}/{len(parts)}::{p}')
          PY

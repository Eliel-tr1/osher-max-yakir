name: סוכן השיחות בשרת

# מעלה את agent/ לשרת (~/osher-max-agent/app, מחוץ לאתר) ומריץ סקריפט אחד.
# שם הסקריפט בשורה הראשונה של .github/run-agent (למשל probe-messages.php).
# הסקריפטים מדפיסים רק ספירות ומבנה, אף פעם לא תוכן של שיחות או מפתחות.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/run-agent']

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # רק כדי לשמור פלט מוצפן בענף evidence
    steps:
      - uses: actions/checkout@v4
      - name: התקנת sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: העלאה והרצה
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT }}
        run: |
          read -r SCRIPT ARGS < .github/run-agent || true
          [[ "$SCRIPT" =~ ^[a-z0-9-]+\.php$ ]] && [ -f "agent/$SCRIPT" ] && [[ "$ARGS" =~ ^[0-9]{0,3}$ ]] || { echo "::error::סקריפט לא תקין: $SCRIPT $ARGS"; exit 1; }
          S() { sshpass -e ssh -p "${PORT:-22}" -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ServerAliveInterval=30 -o ServerAliveCountMax=6 "$USER@$HOST" "$@" 2>&1 | { grep -v bashrc || true; }; }
          tar -C agent -czf - . | S 'umask 077; mkdir -p ~/osher-max-agent/app && tar -xzf - -C ~/osher-max-agent/app'
          if [ "$SCRIPT" = run.php ] || [ "$SCRIPT" = audit-converted.php ]; then
            # הרצה ארוכה: רצה בשרת בנפרד מהחיבור, ומכאן רק בודקים את הלוג
            S "cd ~/osher-max-agent/app && mkdir -p ../state && rm -f ../state/review-out.sealed && (setsid nohup timeout 3000 php $SCRIPT $ARGS > ../state/last-run.log 2>&1 &)"
            for i in $(seq 1 110); do
              sleep 30
              LOG=$(S 'cat ~/osher-max-agent/state/last-run.log')
              echo "$LOG" | grep -qE '^(סיום|הרצה אחרת|PHP Fatal|Fatal error|.*Exception)' && break
            done
            OUT="$LOG"
          else
            OUT=$(S "cd ~/osher-max-agent/app && timeout 3000 php $SCRIPT $ARGS") || { echo "::error::$(echo "$OUT" | tail -3 | tr '\n' ' ')"; exit 1; }
          fi
          echo "$OUT"
          echo "$OUT" | python3 scripts/agent-probe.py notice "סוכן: $SCRIPT"
          # פלט מוצפן (רק סוכן הפיתוח יכול לפתוח), נשמר בענף evidence. רק של הבדיקה שמייצרת אותו
          SEALED=""
          [ "$SCRIPT" = audit-converted.php ] && SEALED=$(S 'cat ~/osher-max-agent/state/review-out.sealed 2>/dev/null' || true)
          if [ -n "$SEALED" ]; then
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch -q origin evidence && git checkout -q -B evidence origin/evidence || git checkout -q --orphan evidence
            mkdir -p review && printf '%s\n' "$SEALED" > "review/${SCRIPT%.php}-${GITHUB_RUN_ID}.sealed"
            git add review && git commit -qm "פלט מוצפן: $SCRIPT" && git push -q origin evidence
            echo "::notice title=פלט מוצפן::review/${SCRIPT%.php}-${GITHUB_RUN_ID}.sealed"
          fi

name: מפתחות לסוכן השיחות

# לוקח את המפתחות מהסודות של גיטהאב וכותב אותם לשרת, ל-~/osher-max-agent/.env
# (מחוץ לאתר, הרשאות לבעלים בלבד). הערכים עוברים בקלט של ssh, לא בשורת הפקודה,
# ולא מודפסים. רץ ידנית, או כשהקובץ .github/run-agent-env משתנה.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/run-agent-env']

jobs:
  write-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: התקנת sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: כתיבת המפתחות לשרת
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT }}
          CLOUDCHAT_API_KEY: ${{ secrets.CLOUDCHAT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          LINES=""
          for k in CLOUDCHAT_API_KEY OPENAI_API_KEY; do
            v="${!k}"; v="${v//$'\r'/}"; v="${v//$'\n'/}"
            [ -n "$v" ] && LINES="$LINES$k=$v"$'\n' || echo "::warning::הסוד $k עוד לא קיים בגיטהאב"
          done
          [ -n "$LINES" ] || { echo "::error::אין אף מפתח בסודות"; exit 1; }
          OUT=$({ cat deploy/agent-env.sh; printf '\n'; } | sshpass -e ssh -p "${PORT:-22}" -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "$USER@$HOST" 'cat > /tmp/osher-agent-env.sh' 2>&1 \
            && printf '%s' "$LINES" | sshpass -e ssh -p "${PORT:-22}" -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR "$USER@$HOST" 'bash /tmp/osher-agent-env.sh; rc=$?; rm -f /tmp/osher-agent-env.sh; exit $rc' 2>&1 | { grep -v "bashrc" || true; }) \
            || { echo "::error::נכשל: $(echo "$OUT" | tail -2 | tr '\n' ' ')"; exit 1; }
          echo "$OUT"
          echo "$OUT" | python3 scripts/agent-probe.py notice 'מפתחות לסוכן'

name: פריסה לשרת

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.claude/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      HOST: ${{ secrets.SERVER_HOST }}
      USER: ${{ secrets.SERVER_USER }}
      PORT: ${{ secrets.SERVER_PORT }}
    steps:
      - name: יש סודות?
        id: gate
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$SSHPASS" ]; then
            echo "::warning::אין עדיין סודות של השרת, הפריסה מדולגת. ראו docs/ENVIRONMENTS.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: בנייה ובדיקה
        if: steps.gate.outputs.ready == 'true'
        run: |
          npm ci
          npm run check
      - name: אריזה
        if: steps.gate.outputs.ready == 'true'
        run: |
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          cp deploy/remote-deploy.sh .next/standalone/
          tar -czf release.tgz -C .next/standalone .
      - name: העלאה והפעלה
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          REL="${GITHUB_SHA::7}"
          OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          sshpass -e ssh -p "${PORT:-22}" $OPTS "$USER@$HOST" "mkdir -p ~/apps/osher-max-dashboard/incoming"
          sshpass -e scp -P "${PORT:-22}" $OPTS release.tgz "$USER@$HOST:apps/osher-max-dashboard/incoming/$REL.tgz"
          sshpass -e ssh -p "${PORT:-22}" $OPTS "$USER@$HOST" \
            "mkdir -p ~/apps/osher-max-dashboard/releases/$REL && tar -xzf ~/apps/osher-max-dashboard/incoming/$REL.tgz -C ~/apps/osher-max-dashboard/releases/$REL && rm ~/apps/osher-max-dashboard/incoming/$REL.tgz && bash ~/apps/osher-max-dashboard/releases/$REL/remote-deploy.sh $REL"

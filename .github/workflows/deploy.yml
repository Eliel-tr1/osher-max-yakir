name: פריסה לשרת

# בונה את הדשבורד כאתר סטטי ומעלה אותו לתיקייה oshermax באתר ai.vitrue.co.il.
# רץ בכל דחיפה ל-main שמשנה קוד, או ידנית (Actions > פריסה לשרת > Run workflow).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/run-server-check'
      - '.github/workflows/server-check.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/profile-sheet.yml'
      - '.github/workflows/shots.yml'
      - '.github/run-shots'
      - 'scripts/shots.mjs'
      - 'scripts/profile-sheet.py'
      - 'scripts/summary.ts'
      - 'scripts/parity-real.ts'
      - '.github/workflows/refresh-data.yml'
      - '.github/run-agent-probe'
      - '.github/workflows/agent-probe.yml'
      - 'scripts/agent-probe.py'
      - 'scripts/people-profile.py'
      - '.github/run-agent-env'
      - '.github/workflows/agent-env.yml'
      - 'deploy/agent-env.sh'
      - 'deploy/agent-crypt.php'
      - 'deploy/agent-env.enc'
      - '.github/run-agent-env-enc'
      - '.github/workflows/agent-env-enc.yml'
      - 'agent/**'
      - '.github/run-agent'
      - '.github/workflows/agent-run.yml'
      - '.github/run-refresh'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_URL: https://ai.vitrue.co.il/oshermax/
  SHEET_ID: 1nTqoRITyNlLJO4Pld0H4SRMIbT21oudBw6mDBoxXaUU
  SHEET_GID: "0"   # הלשונית "לידים"
  PURCHASES_GID: "282711056"   # הלשונית "רכישות"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      HOST: ${{ secrets.SERVER_HOST }}
      USER: ${{ secrets.SERVER_USER }}
      PORT: ${{ secrets.SERVER_PORT }}
    steps:
      - name: יש סודות?
        id: gate
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$SSHPASS" ]; then
            echo "::warning::אין סודות של השרת, הפריסה מדולגת. ראו docs/ENVIRONMENTS.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: בנייה ובדיקה
        if: steps.gate.outputs.ready == 'true'
        run: |
          npm ci
          # הנתונים לא נבנים כאן: בשרת, באותה פונקציה של הכפתור ושל 06:30 (הנחיית המנהל 3/11/2026). ראו השלב "רענון ותזמון"
          # הגרסה נכנסת לבנייה, כדי שדף שנפתח מהמטמון ייטען מחדש פעם אחת כשעלתה גרסה חדשה
          NEXT_PUBLIC_BUILD_SHA="${GITHUB_SHA::7}" npm run check
      - name: אריזה
        if: steps.gate.outputs.ready == 'true'
        run: |
          REL="${GITHUB_SHA::7}"
          echo "{\"app\":\"osher-max-dashboard\",\"sha\":\"$REL\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > out/version.json
          touch out/.osher-max-dashboard
          # נתוני ההדגמה שבריפו לא עולים לאתר. הנתונים האמיתיים בשרת, מחוץ לאתר
          rm -rf out/data
          tar -czf release.tgz -C out .
      - name: העלאה והחלפה
        if: steps.gate.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          REL="${GITHUB_SHA::7}"
          OPTS="-o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ConnectTimeout=20"
          STATE=.cache/osher-max-dashboard
          sshpass -e ssh -p "${PORT:-22}" $OPTS "$USER@$HOST" "mkdir -p ~/$STATE"
          sshpass -e scp -P "${PORT:-22}" $OPTS release.tgz "$USER@$HOST:$STATE/release-$REL.tgz"
          sshpass -e scp -P "${PORT:-22}" $OPTS deploy/static-deploy.sh "$USER@$HOST:$STATE/static-deploy.sh"
          sshpass -e ssh -p "${PORT:-22}" $OPTS "$USER@$HOST" "bash ~/$STATE/static-deploy.sh $REL ~/$STATE/release-$REL.tgz"
      - name: חשבון שירות של Google (רק אם יש סוד)
        if: steps.gate.outputs.ready == 'true'
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          # קריאת הגיליון עם חשבון שירות (#29), לפני הריצה לבדיקה, כדי שהיא תראה מאיפה נקרא. המפתח רק בסוד ובתיקייה הפרטית
          # בשרת (מחוץ לאתר, לבעלים בלבד), ולא מודפס. בלי הסוד הקריאה נשארת בקישור הציבורי. מפתח שכבר בשרת נשאר גם כשאין סוד,
          # כדי שקריאה לא תישבר אחרי שהשיתוף של הגיליון הוגבל.
          if [ -z "$GOOGLE_SA_JSON" ]; then
            echo "::notice title=חשבון שירות::אין סוד GOOGLE_SA_JSON. הגיליון נקרא כמו קודם"
            exit 0
          fi
          printf '%s' "$GOOGLE_SA_JSON" | python3 -c 'import json, sys; k = json.load(sys.stdin); sys.exit(0 if k.get("type") == "service_account" and k.get("client_email") and k.get("private_key") else 1)' >/dev/null 2>&1 \
            || { echo "::error::הסוד GOOGLE_SA_JSON הוא לא קובץ מפתח (JSON) של חשבון שירות"; exit 1; }
          OPTS="-o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ConnectTimeout=20"
          printf '%s' "$GOOGLE_SA_JSON" | sshpass -e ssh -p "${PORT:-22}" $OPTS "$USER@$HOST" 'umask 077; mkdir -p ~/osher-max-private && cat > ~/osher-max-private/google-sa.json.tmp && mv ~/osher-max-private/google-sa.json.tmp ~/osher-max-private/google-sa.json && rm -f ~/osher-max-private/google-token.json'
          echo "::notice title=חשבון שירות::המפתח נכתב לשרת. הריצה לבדיקה בשלב הבא תראה אם הגיליון נקרא איתו (source)"
      - name: רענון ותזמון יומי (06:30 שעון ישראל)
        if: steps.gate.outputs.ready == 'true'
        run: |
          # הרענון האוטומטי היחיד: crontab בשרת, פעם ביום ב-06:30 לפי שעון ישראל (הנחיית המנהל 3/11/2026).
          # מותקן רק אם השעון של השרת הוא שעון ישראל, כולל קיץ וחורף. כל שורה אחרת של רענון הדשבורד נמחקת; שורות אחרות לא נוגעים בהן.
          # אחרי הפריסה הנתונים נבנים פעם אחת באותה פונקציה (מבנה הנתונים יכול להשתנות עם הקוד), וזו גם הריצה לבדיקה.
          OPTS="-o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ConnectTimeout=20"
          OUT=$(sshpass -e ssh -p "${PORT:-22}" $OPTS "$USER@$HOST" 'bash -s' 2>&1 <<'REMOTE' | grep -v "bashrc"
          umask 077
          STATE="$HOME/.cache/osher-max-dashboard"; mkdir -p "$STATE"
          SCRIPT="$HOME/htdocs/ai.vitrue.co.il/oshermax/refresh-cron.php"
          TAG="osher-max-dashboard:refresh"
          PHP=$(command -v php)
          ZONE=$(timedatectl show -p Timezone --value 2>/dev/null || cat /etc/timezone 2>/dev/null || readlink /etc/localtime)
          SUMMER=$(date -d "2026-07-01 12:00 UTC" +%z); WINTER=$(date -d "2026-01-01 12:00 UTC" +%z)
          OK=no
          case "$ZONE" in *Asia/Jerusalem*|*Asia/Tel_Aviv*|*Israel*) [ "$SUMMER" = "+0300" ] && [ "$WINTER" = "+0200" ] && OK=yes ;; esac
          echo "שעון השרת: $ZONE, קיץ $SUMMER, חורף $WINTER, שעון ישראל: $OK"
          CUR=$(crontab -l 2>"$STATE/ct.err"); RC=$?
          if [ $RC -ne 0 ] && ! grep -qi "no crontab" "$STATE/ct.err"; then echo "crontab -l נכשל, לא נגעתי ב-crontab"; exit 1; fi
          [ $RC -ne 0 ] && CUR=""
          printf "%s\n" "$CUR" > "$STATE/crontab.bak"
          MINE='osher-max-dashboard|oshermax/refresh|refresh-cron\.php'
          KEEP=$(printf "%s\n" "$CUR" | grep -vE "$MINE" | sed '/^$/d')
          echo "שורות רענון של הדשבורד שנמחקו: $(printf "%s\n" "$CUR" | grep -cE "$MINE")"
          if [ "$OK" = yes ]; then
            LINE="30 6 * * * $PHP $SCRIPT >> $STATE/refresh-cron.log 2>&1 # $TAG"
            if [ -n "$KEEP" ]; then printf "%s\n%s\n" "$KEEP" "$LINE" | crontab -; else printf "%s\n" "$LINE" | crontab -; fi
          elif [ -n "$KEEP" ]; then printf "%s\n" "$KEEP" | crontab -; else crontab -r 2>/dev/null || true; fi
          AFTER=$(crontab -l 2>/dev/null)
          if [ "$(printf "%s\n" "$AFTER" | grep -vE "$MINE" | sed '/^$/d')" != "$KEEP" ]; then
            echo "שורות אחרות ב-crontab השתנו: מחזיר את הגיבוי"; crontab "$STATE/crontab.bak"; exit 1
          fi
          echo "תזמונים של הדשבורד אחרי הניקוי: $(printf "%s\n" "$AFTER" | grep -cE "$MINE")"
          printf "%s\n" "$AFTER" | grep -E "$MINE" | sed "s#$HOME#~#g"
          echo "שורות פעילות ב-crontab בסך הכול: $(printf "%s\n" "$AFTER" | grep -cvE '^[[:space:]]*(#|$)')"
          echo "הסוכן הלילי ב-crontab: $(printf "%s\n" "$AFTER" | grep -v '^[[:space:]]*#' | grep -c 'osher-max-''agent')"
          echo "ריצה לבדיקה: $("$PHP" "$SCRIPT" | tail -1 | cut -c1-700)"
          REMOTE
          )
          echo "$OUT"
          NOTE="${OUT//'%'/%25}"; NOTE="${NOTE//$'\r'/}"; NOTE="${NOTE//$'\n'/%0A}"
          echo "::notice title=רענון ותזמון::$NOTE"
          echo "$OUT" | grep -q "^ריצה לבדיקה: [0-9TZ:-]* 200 " || { echo "::error::הריצה לבדיקה של הרענון נכשלה"; exit 1; }
      - name: הגדרת הכניסה בסיסמה (רק אם יש סוד)
        if: steps.gate.outputs.ready == 'true'
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          # רווחים, מרכאות וסימני כיוון נסתרים (נכנסים כשמעתיקים מטקסט בעברית) מוסרים, כמו בבדיקה ב-PHP. רק גיבוב הסיסמה (PBKDF2 עם מלח אקראי) נכתב לשרת, מחוץ לתיקיית האתר. הסיסמה לא נשמרת ולא מודפסת (#6, 1/11)
          if [ -z "$DASHBOARD_PASSWORD" ]; then
            echo "::notice title=כניסה::עוד לא הוגדרה: חסר הסוד DASHBOARD_PASSWORD"
            exit 0
          fi
          OPTS="-o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ConnectTimeout=20"
          python3 -c 'import hashlib, json, os, re, secrets; salt = secrets.token_hex(16); it = 300000; print(json.dumps({"salt": salt, "iter": it, "hash": hashlib.pbkdf2_hmac("sha256", re.sub(r"[\s\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff\"]", "", os.environ["DASHBOARD_PASSWORD"]).encode(), salt.encode(), it).hex()}))' \
            | sshpass -e ssh -p "${PORT:-22}" $OPTS "$USER@$HOST" 'umask 077; mkdir -p ~/osher-max-private && cat > ~/osher-max-private/auth.json.tmp && mv ~/osher-max-private/auth.json.tmp ~/osher-max-private/auth.json && rm -f ~/osher-max-private/attempts.json'
          echo "::notice title=כניסה::הוגדרה"
      - name: גישת קריאה עם סוד בכותרת (רק אם יש סוד)
        if: steps.gate.outputs.ready == 'true'
        env:
          DASHBOARD_READ_TOKEN: ${{ secrets.DASHBOARD_READ_TOKEN }}
        run: |
          # #28: קריאה של data.php בלי סיסמה, עם הכותרת X-Dashboard-Read-Token (בשביל b2b-cmd). לשרת נכתב רק גיבוב (PBKDF2 עם מלח
          # אקראי), מחוץ לאתר. הסוד לא נשמר ולא מודפס. בלי הסוד, הקובץ נמחק והגישה סגורה (כך מבטלים אותה).
          OPTS="-o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ConnectTimeout=20"
          if [ -z "$DASHBOARD_READ_TOKEN" ]; then
            sshpass -e ssh -p "${PORT:-22}" $OPTS "$USER@$HOST" 'rm -f ~/osher-max-private/read-token.json'
            echo "::notice title=גישת קריאה::אין סוד DASHBOARD_READ_TOKEN: הגישה בלי סיסמה סגורה"
            exit 0
          fi
          # רווחים בהתחלה ובסוף לא נחשבים, כמו בבדיקה ב-PHP (trim)
          T=$(python3 -c 'import os; print(os.environ["DASHBOARD_READ_TOKEN"].strip(" \t\n\r\0\x0b"), end="")')
          if [ ${#T} -lt 24 ]; then
            echo "::error::DASHBOARD_READ_TOKEN קצר מדי: צריך לפחות 24 תווים אקראיים. הגישה לא הוגדרה"
            exit 1
          fi
          T="$T" python3 -c 'import hashlib, json, os, secrets; salt = secrets.token_hex(16); it = 60000; print(json.dumps({"salt": salt, "iter": it, "hash": hashlib.pbkdf2_hmac("sha256", os.environ["T"].encode(), salt.encode(), it).hex()}))' \
            | sshpass -e ssh -p "${PORT:-22}" $OPTS "$USER@$HOST" 'umask 077; mkdir -p ~/osher-max-private && cat > ~/osher-max-private/read-token.json.tmp && mv ~/osher-max-private/read-token.json.tmp ~/osher-max-private/read-token.json && rm -f ~/osher-max-private/read-attempts.json'
          echo "::notice title=גישת קריאה::הוגדרה (רק data.php, בכותרת X-Dashboard-Read-Token)"
      - name: הכתובת מציגה את הגרסה החדשה?
        if: steps.gate.outputs.ready == 'true'
        env:
          DASHBOARD_READ_TOKEN: ${{ secrets.DASHBOARD_READ_TOKEN }}
        run: |
          REL="${GITHUB_SHA::7}"
          for i in $(seq 1 12); do
            if curl -fsS "${SITE_URL}version.json?t=$(date +%s)" | grep -q "\"sha\":\"$REL\""; then
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL")
              BTN=$(curl -s --max-time 30 "${SITE_URL}refresh.php" | head -c 300)
              DATA=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}data.php"); OLD=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}data/leads.json")
              BAD=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Dashboard-Read-Token: not-the-secret-$(date +%s)" "${SITE_URL}data.php")
              # עם הסוד הנכון (#28): רק קוד התשובה, בלי הנתונים. הסוד מוסתר בלוג
              GOOD="אין סוד"
              if [ -n "$DASHBOARD_READ_TOKEN" ]; then
                T=$(python3 -c 'import os; print(os.environ["DASHBOARD_READ_TOKEN"].strip(" \t\n\r\0\x0b"), end="")')
                GOOD=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Dashboard-Read-Token: $T" "${SITE_URL}data.php")
              fi
              echo "::notice title=פריסה::הדשבורד באוויר: $SITE_URL (גרסה $REL, הדף עונה $CODE). מצב הנתונים: $BTN. בלי כניסה: data.php $DATA, data/leads.json $OLD, עם סוד שגוי בכותרת $BAD, עם הסוד הנכון $GOOD"
              exit 0
            fi
            sleep 5
          done
          echo "::error::הקבצים עלו לשרת, אבל $SITE_URL לא מציג את הגרסה החדשה"
          exit 1

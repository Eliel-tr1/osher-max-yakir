name: עדכון נתונים

# רענון ידני של הנתונים, בשרת, באותה פונקציה של כפתור הרענון ושל 06:30 (הנחיית המנהל 3/11/2026).
# בלי ריצה מתוזמנת: הרענון האוטומטי היחיד הוא ה-crontab של 06:30 בשרת.
on:
  workflow_dispatch:
  # הסוכן לא יכול להפעיל ידנית, אז שינוי בקובץ הזה מפעיל ריצה
  push:
    branches: [main]
    paths: ['.github/run-refresh']

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      HOST: ${{ secrets.SERVER_HOST }}
      USER: ${{ secrets.SERVER_USER }}
      PORT: ${{ secrets.SERVER_PORT }}
    steps:
      - name: רענון בשרת, באותה פונקציה של הכפתור ושל 06:30
        run: |
          # ידני בלבד, לא תזמון: רץ כשמשנים את .github/run-refresh (הסוכן לא יכול להפעיל ידנית) או מהממשק.
          # לא בונה נתונים כאן: מריץ בשרת את refresh-cron.php, אותה פונקציה של הכפתור (הנחיית המנהל 3/11/2026)
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$SSHPASS" ]; then echo "::error::חסרים סודות של השרת"; exit 1; fi
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)
          OPTS="-o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ConnectTimeout=20"
          OUT=$(sshpass -e ssh -p "${PORT:-22}" $OPTS "$USER@$HOST" 'php "$HOME/htdocs/ai.vitrue.co.il/oshermax/refresh-cron.php"' 2>&1 | grep -v bashrc | tail -1 | cut -c1-400)
          echo "::notice title=עדכון נתונים::$OUT"
          echo "$OUT" | grep -q "^[0-9TZ:-]* 200 " || { echo "::error::הרענון נכשל"; exit 1; }

name: בדיקת שרת

# מראה מה יש על השרת שבסודות. לא משנה כלום בשרת: רק קורא.
# רץ ידנית (Actions > בדיקת שרת > Run workflow), או כשהקובץ .github/run-server-check משתנה.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/run-server-check']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: התקנת sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: חיבור וקריאה בלבד
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$SSHPASS" ]; then
            echo "::error::חסרים סודות: SERVER_HOST, SERVER_USER, SERVER_PASSWORD"; exit 1
          fi
          OUT=$(sshpass -e ssh -p "${PORT:-22}" -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ConnectTimeout=20 "$USER@$HOST" '
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh" >/dev/null 2>&1
            export PATH="$HOME/.local/bin:$PATH"
            echo "== מערכת"; (. /etc/os-release 2>/dev/null && echo "$PRETTY_NAME") || uname -s
            echo "== משתמש"; whoami; echo "home: $HOME"
            echo "== לוח ניהול"; [ -d /home/clp ] && echo "CloudPanel" || ([ -d /usr/local/cpanel ] && echo "cPanel") || echo "לא זוהה"
            echo "== Node"; command -v node >/dev/null && node -v || echo "אין Node"
            echo "== nvm"; [ -s "$HOME/.nvm/nvm.sh" ] && echo "יש nvm" || echo "אין nvm"
            echo "== pm2"; if command -v pm2 >/dev/null; then pm2 -v; echo "תהליכים: $(pm2 jlist 2>/dev/null | grep -o "\"name\":\"[^\"]*\"" | cut -d\" -f4 | sort -u | tr "\n" " ")"; else echo "אין pm2"; fi
            echo "== sudo"; sudo -n true 2>/dev/null && echo "יש sudo בלי סיסמה" || echo "אין sudo בלי סיסמה"
            echo "== מקום פנוי"; df -h "$HOME" | tail -1
            PORTS=$(ss -ltnH 2>/dev/null | awk "{print \$4}" | sed -E "s/.*[:.]([0-9]+)\$/\1/" | sort -n | uniq | tr "\n" " ")
            echo "== פורטים פתוחים"; echo "$PORTS"
            echo "== מי עונה בפורטים 3000-9999"; for p in $PORTS; do if [ "$p" -ge 3000 ] && [ "$p" -le 9999 ]; then echo "$p: $(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:$p/)"; fi; done
            echo "== תיקיות בבית"; ls -1 "$HOME" | head -15
            echo "== htdocs"; for d in "$HOME"/htdocs/*/; do [ -d "$d" ] || continue; echo "-- $(basename "$d")"; ls -1A "$d" | head -15 | tr "\n" " "; echo; done
            echo "== apps"; ls -1 "$HOME/apps" 2>/dev/null | head -10 || true
          ' 2>&1) || { echo "::error::החיבור נכשל, או שהמשתמש מורשה רק ל-SFTP בלי פקודות: $(echo "$OUT" | tail -3 | tr '\n' ' ')"; exit 1; }
          echo "$OUT"
          # גם כהערה על הריצה, כדי שאפשר יהיה לקרוא את התוצאה בלי הלוג המלא
          NOTE="${OUT//'%'/%25}"; NOTE="${NOTE//$'\r'/}"; NOTE="${NOTE//$'\n'/%0A}"
          echo "::notice title=בדיקת שרת::$NOTE"

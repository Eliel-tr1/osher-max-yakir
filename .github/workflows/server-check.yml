name: בדיקת שרת

# מראה מה יש על השרת שבסודות. לא משנה כלום בשרת: רק קורא.
# רץ ידנית (Actions > בדיקת שרת > Run workflow), או כשהקובץ .github/run-server-check משתנה.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/run-server-check']

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: התקנת sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: חיבור וקריאה בלבד
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$SSHPASS" ]; then
            echo "::error::חסרים סודות: SERVER_HOST, SERVER_USER, SERVER_PASSWORD"; exit 1
          fi
          OUT=$(sshpass -e ssh -p "${PORT:-22}" -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ConnectTimeout=20 "$USER@$HOST" '
            echo "== מערכת"; (. /etc/os-release 2>/dev/null && echo "$PRETTY_NAME") || uname -s
            echo "== כלים"; for c in tar curl; do command -v $c >/dev/null && echo "$c: יש" || echo "$c: אין"; done
            echo "== מקום פנוי"; df -h "$HOME" | tail -1 | awk "{print \$4}"
            echo "== PHP"; command -v php >/dev/null && php -v | head -1 || echo "אין php בשורת הפקודה"
            command -v php >/dev/null && php -m 2>/dev/null | grep -ixE "curl|openssl|json" | tr "\n" " "; echo
            echo "== קבצי php באתר"; find "$HOME/htdocs/ai.vitrue.co.il" -maxdepth 2 -name "*.php" 2>/dev/null | wc -l
            echo "== יציאה ל-api.github.com"; curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.github.com/zen; echo
            echo "== יציאה ל-Google Sheets"; curl -s -L -o /tmp/osher-probe.csv -w "%{http_code} %{content_type} %{time_total}s" --max-time 30 "https://docs.google.com/spreadsheets/d/1nTqoRITyNlLJO4Pld0H4SRMIbT21oudBw6mDBoxXaUU/gviz/tq?tqx=out:csv&sheet=%D7%9C%D7%99%D7%93%D7%99%D7%9D"; echo " $(wc -c < /tmp/osher-probe.csv 2>/dev/null) bytes"; rm -f /tmp/osher-probe.csv
            echo "== PHP-FPM"; php -r "echo ini_get(\"max_execution_time\"), \"s, memory \", ini_get(\"memory_limit\");"; echo
            D="$HOME/htdocs/ai.vitrue.co.il"
            echo "== האתר ai.vitrue.co.il"
            if [ -d "$D" ]; then
              echo "התיקייה קיימת"; [ -w "$D" ] && echo "יש הרשאת כתיבה" || echo "אין הרשאת כתיבה"
              if [ -L "$D/oshermax" ]; then echo "oshermax: קישור, לא שלנו"
              elif [ -f "$D/oshermax/.osher-max-dashboard" ]; then echo "oshermax: שלנו, גרסה $(grep -o "\"sha\":\"[^\"]*\"" "$D/oshermax/version.json" 2>/dev/null | cut -d\" -f4)"
              elif [ -e "$D/oshermax" ]; then echo "oshermax: קיים ולא שלנו"
              else echo "oshermax: פנוי"; fi
            else echo "התיקייה לא נמצאה"; fi
          ' 2>&1) || { echo "::error::החיבור נכשל, או שהמשתמש מורשה רק ל-SFTP בלי פקודות: $(echo "$OUT" | tail -3 | tr '\n' ' ')"; exit 1; }
          echo "$OUT"
          # גם כהערה על הריצה, כדי שאפשר יהיה לקרוא את התוצאה בלי הלוג המלא
          NOTE="${OUT//'%'/%25}"; NOTE="${NOTE//$'\r'/}"; NOTE="${NOTE//$'\n'/%0A}"
          echo "::notice title=בדיקת שרת::$NOTE"
      - name: הכתובת מבחוץ
        if: always()
        run: |
          OUT=""
          for u in https://ai.vitrue.co.il/oshermax https://ai.vitrue.co.il/oshermax/ https://ai.vitrue.co.il/oshermax/index.html https://ai.vitrue.co.il/; do
            H=$(curl -sS -o /dev/null -D - --max-time 20 -A "Mozilla/5.0" "$u" 2>&1 | tr -d '\r')
            CODE=$(echo "$H" | awk 'toupper($1) ~ /^HTTP/ {c=$2} END {print c}')
            LOC=$(echo "$H" | awk 'tolower($1)=="location:" {print $2}')
            TYPE=$(echo "$H" | awk 'tolower($1)=="content-type:" {print $2}')
            OUT="$OUT$u -> $CODE ${LOC:+(אל $LOC) }${TYPE}"$'\n'
          done
          FINAL=$(curl -sS -L -o /dev/null -w "%{http_code} %{url_effective} hops=%{num_redirects}" --max-time 20 -A "Mozilla/5.0" https://ai.vitrue.co.il/oshermax 2>&1)
          OUT="${OUT}בלי לוכסן, עם מעקב הפניות: $FINAL"
          echo "$OUT"
          NOTE="${OUT//'%'/%25}"; NOTE="${NOTE//$'\n'/%0A}"
          echo "::notice title=הכתובת מבחוץ::$NOTE"
